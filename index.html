<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Casa de muñecas Cuniellas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IM+Fell+English:ital@0;1&family=Italiana&display=swap">
<style>
/* Concepto: sala de control de los Maestros. La casa de tres plantas (plano de Cuniellas I) se
   muestra como maqueta abierta bajo una noche de bosque; el reparto de fichas va a la derecha
   y, en móvil, pasa a una tira fija encima de la casa. Un solo look oscuro, sacado del cartel. */
:root{
  color-scheme: dark;
  --bg:#09120f;
  --bg-2:#0f1c18;
  --line:#25392f;
  --bone:#e9e1cc;
  --bone-dim:#a3a58f;
  --gold:#d9a441;
  --ink:#0b1412;
  --f-wood:#2b2216; --f-tile:#16292b; --f-moss:#16302a; --f-stone:#1f2824; --f-deck:#34281a; --f-grass:#0e2018;
  --wall:#d6cdb4; --frame:#5a4730; --door:#8c6a37; --glow:#4f9aa2; --furn:#6d7560;
  --display:'Italiana','Didot',Georgia,serif;
  --serif:'IM Fell English','Iowan Old Style',Georgia,serif;
  --ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tk:36px;
  --ease:cubic-bezier(.2,.85,.25,1);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  background-color:var(--bg);
  background-image:radial-gradient(90% 40% at 50% 0%,#12302f 0%,rgba(18,48,47,0) 72%);
  background-repeat:no-repeat;
  color:var(--bone);
  font:400 14px/1.45 var(--ui);
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Cabecera */
.top{max-width:1010px;margin:0 auto 16px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
h1{margin:0;font:400 clamp(30px,8vw,46px)/1 var(--display);letter-spacing:.3em;text-transform:uppercase;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--bone-dim);font-size:13px}
.live{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--bone-dim);background:var(--bg-2)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--bone-dim)}
.live[data-s=live] i{background:#6fcf97;box-shadow:0 0 0 3px rgba(111,207,151,.2)}
.live[data-s=live]{color:var(--bone)}
.live[data-s=ro] i{background:var(--gold)}
.live[data-s=off] i{background:#d9705f}

/* Estructura */
.app{max-width:1010px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.side{display:contents}
.dock{order:-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);padding-block:8px 6px;display:flex;flex-direction:column;gap:6px}
.info{order:1;display:flex;flex-direction:column;gap:22px}
.stage-wrap{min-width:0}

/* Maqueta */
.stage{position:relative;width:100%;aspect-ratio:752/1870;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.rm.k-wood{fill:var(--f-wood)} .rm.k-tile{fill:var(--f-tile)} .rm.k-moss{fill:var(--f-moss)}
.rm.k-stone{fill:var(--f-stone)} .rm.k-deck,.rm.k-steps{fill:var(--f-deck)} .k-grass{fill:var(--f-grass)}
.pt{stroke:var(--bone);stroke-opacity:.08;stroke-width:1.5;fill:none}
.wall{fill:none;stroke:var(--wall);stroke-width:5}
.frame{fill:none;stroke:var(--frame);stroke-width:11;stroke-linejoin:round}
.roofline{fill:none;stroke:var(--frame);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.solid{fill:var(--frame)}
.door{fill:var(--door)}
.win{fill:var(--glow);fill-opacity:.55;stroke:var(--wall);stroke-width:2}
.fn{fill:none;stroke:var(--furn);stroke-width:2.2}
.st{fill:none;stroke:var(--furn);stroke-width:1.8}
.rail{fill:none;stroke:var(--bone);stroke-opacity:.45;stroke-width:2.5;stroke-dasharray:2 10;stroke-linecap:round}
.tree{fill:none;stroke:#050b09;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.swing{fill:none;stroke:#26352c;stroke-width:4;stroke-linecap:round}
.stone{fill:#22332a}
.ring{fill:none;stroke:var(--bone);stroke-opacity:.3;stroke-width:2;stroke-dasharray:3 9;stroke-linecap:round}
.rune{fill:none;stroke:var(--bone);stroke-opacity:.5;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lbl{font:italic 400 20px var(--serif);fill:var(--bone-dim)}
.lbl.mid{text-anchor:middle}
.tag{font:400 17px var(--serif);letter-spacing:.24em;fill:var(--bone-dim);text-anchor:middle}
.hit{fill:transparent;stroke:none}
.has-sel .hit{cursor:pointer}
.has-sel .hit:hover{fill:rgba(217,164,65,.1)}
.hit.drop{fill:rgba(217,164,65,.16);stroke:var(--gold);stroke-width:3}

/* Fichas */
.tok{
  position:absolute;width:var(--tk);height:var(--tk);transform:translate(-50%,-50%);
  padding:0;border:0;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.5),rgba(255,255,255,0) 52%),var(--c,#ccc);
  color:var(--ink);font-weight:700;font-size:calc(var(--tk)*.34);line-height:1;
  display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--ink),0 5px 0 -1px rgba(0,0,0,.5),0 9px 14px rgba(0,0,0,.45);
  cursor:grab;touch-action:none;pointer-events:auto;z-index:2;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:left .55s var(--ease),top .55s var(--ease),transform .15s,box-shadow .15s;
}
.tok.drag{transition:none;cursor:grabbing;transform:translate(-50%,-50%) scale(1.14);z-index:9;box-shadow:0 0 0 2px var(--ink),0 12px 18px rgba(0,0,0,.55)}
.tok.sel{z-index:6;box-shadow:0 0 0 2px var(--ink),0 0 0 5px var(--gold),0 9px 14px rgba(0,0,0,.45);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--ink),0 0 0 8px rgba(217,164,65,.45),0 9px 14px rgba(0,0,0,.45)}}
.tok:focus-visible{outline:2px solid var(--bone);outline-offset:5px}
.tok.sect{background:none;border-radius:0;box-shadow:none;width:calc(var(--tk)*.98);height:calc(var(--tk)*1.22);filter:drop-shadow(0 6px 5px rgba(0,0,0,.65))}
.tok.sect svg{width:100%;height:100%;display:block}
.tok.sect.sel{outline:2px solid var(--gold);outline-offset:4px;border-radius:14px;animation:none}
.tok.sect.drag{box-shadow:none}
.lab{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;padding:1px 7px;border-radius:99px;background:rgba(9,18,15,.86);color:var(--bone);font:500 11px/1.4 var(--ui);white-space:nowrap;pointer-events:none;display:none}
.tok.sel .lab{display:block}

/* Reparto */
.rost{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 1px}
.rost::-webkit-scrollbar{display:none}
.hd{display:none;margin:0 0 8px;font:italic 400 19px var(--serif);color:var(--bone)}
.grp{display:flex;gap:6px}
#gSect{border-left:1px solid var(--line);padding-left:8px}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:46px;min-width:0;padding:5px 12px 5px 6px;background:var(--bg-2);color:var(--bone);border:1px solid var(--line);border-radius:12px;text-align:left;cursor:pointer}
.chip:hover{border-color:var(--bone-dim)}
.chip[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.sw{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--ink);font:700 12px/1 var(--ui);box-shadow:inset 0 0 0 1.5px rgba(11,20,18,.55)}
.chip.sect .sw{background:#0a0b0b;box-shadow:inset 0 0 0 1.5px rgba(233,225,204,.35);padding:4px}
.chip.sect .sw svg{width:100%;height:100%;display:block}
.txt{display:flex;flex-direction:column;min-width:0}
.nm{font-weight:600;font-size:13.5px;line-height:1.15}
.zn{font-size:11.5px;line-height:1.25;color:var(--bone-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
.selbar{display:flex;align-items:center;gap:8px;min-height:32px;font-size:12.5px;color:var(--bone-dim)}
.selbar #selTxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar b{color:var(--bone);font-weight:600}
.selbar select{flex:none;max-width:50%;font:500 13px var(--ui);color:var(--bone);background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.selbar .x{flex:none;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;color:var(--bone-dim);line-height:1}

/* Información */
.panel h2{margin:0 0 8px;font:italic 400 19px var(--serif);color:var(--bone)}
.floors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0}
.floors div{border:1px solid var(--line);border-radius:8px;padding:8px 4px 7px;text-align:center}
.floors dt{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--bone-dim)}
.floors dd{margin:3px 0 0;font:600 22px/1 var(--ui);font-variant-numeric:tabular-nums}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:flex;align-items:baseline;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.recent .d{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);align-self:center}
.recent .d.s{background:#0a0b0b;box-shadow:inset 0 0 0 1.5px rgba(233,225,204,.5)}
.recent time{margin-left:auto;flex:none;color:var(--bone-dim);font-size:12px;font-variant-numeric:tabular-nums}
.empty{margin:0;color:var(--bone-dim);font-size:13px;border-top:1px solid var(--line);padding-top:9px}
.btn{min-height:40px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;font-weight:500;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--bone-dim)}
.btn.warn{border-color:#d9705f;color:#f0b1a6}
.btn:disabled{opacity:.55;cursor:default}
.note{margin:0;color:var(--bone-dim);font-size:12.5px;max-width:46ch}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:min(92vw,420px);padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#142520;color:var(--bone);font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* Puerta de entrada */
body:not(.open) .top,body:not(.open) .app{display:none}
body.open .gate{display:none}
.gate{min-height:70vh;display:grid;place-items:center}
.gate form{width:min(100%,340px);display:flex;flex-direction:column;gap:10px}
.gmark{margin:0 0 14px;font:400 clamp(34px,10vw,52px)/1 var(--display);letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;text-align:center}
.gate label{font:italic 400 18px var(--serif);color:var(--bone-dim)}
.grow{display:flex;gap:8px}
.gate input{flex:1;min-width:0;min-height:44px;padding:8px 12px;font:500 16px var(--ui);color:var(--bone);background:var(--bg-2);border:1px solid var(--line);border-radius:8px}
.gerr{margin:0;color:#f0b1a6;font-size:13px}
.top .out{margin-left:8px;padding:5px 11px;min-height:0;border-radius:99px;font-size:12px;color:var(--bone-dim)}
.right{display:flex;align-items:center}

@media (min-width:760px){
  .lab{display:block}
}
@media (min-width:860px){
  :root{--tk:42px}
  .app{display:grid;grid-template-columns:minmax(0,620px) minmax(300px,1fr);gap:32px;align-items:start}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding-right:2px}
  .dock{order:0;position:static;background:none;box-shadow:none;clip-path:none;padding:0;gap:10px}
  .info{order:0}
  .rost{flex-direction:column;overflow:visible;gap:14px;padding:0}
  .hd{display:block}
  .grp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  #gSect{border-left:0;padding-left:0}
  .chip{flex:initial}
  .zn{max-width:none}
}
/* Modo solo vista: sin panel lateral */
body.mode-view .side{display:none}
body.mode-view .app{display:flex;flex-direction:column;max-width:620px}
body.mode-view .lab{display:block}
@media (prefers-reduced-motion:reduce){
  .tok{transition:none}
  .tok.sel{animation:none}
}
</style>

<div class="gate" id="gate">
  <form id="gForm" autocomplete="off">
    <p class="gmark">Örak'el</p>
    <label for="gIn">Palabra de paso</label>
    <div class="grow">
      <input id="gIn" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      <button type="submit" class="btn">Entrar</button>
    </div>
    <p class="gerr" id="gErr" role="alert" hidden>Esa palabra no abre nada.</p>
  </form>
</div>

<header class="top">
  <div>
    <h1>Örak'el</h1>
    <p class="sub">Casa de muñecas de Cuniellas · 27–28 de noviembre</p>
  </div>
  <div class="right">
    <span class="live" id="live" data-s="connecting" role="status"><i></i><span id="liveTx">Conectando…</span></span>
    <button type="button" class="btn out" id="lock">Salir</button>
  </div>
</header>

<div class="app">
  <main class="stage-wrap">
    <div class="stage" id="stage"><div class="layer" id="layer"></div></div>
  </main>

  <aside class="side">
    <div class="dock" id="dock">
      <div class="rost">
        <div>
          <h2 class="hd">Jugadores</h2>
          <div class="grp" id="gPlayers"></div>
        </div>
        <div>
          <h2 class="hd">La secta</h2>
          <div class="grp" id="gSect"></div>
        </div>
      </div>
      <div class="selbar">
        <span id="selTxt"></span>
        <select id="moveTo" aria-label="Mover la ficha seleccionada a otra sala" hidden></select>
        <button type="button" class="x" id="unsel" aria-label="Soltar la ficha seleccionada" hidden>×</button>
      </div>
    </div>

    <div class="info">
      <section class="panel">
        <h2>Jugadores por planta</h2>
        <dl class="floors">
          <div><dt>Ático</dt><dd id="c-atico">0</dd></div>
          <div><dt>Planta 1</dt><dd id="c-p1">0</dd></div>

          <div><dt>Fuera</dt><dd id="c-ext">0</dd></div>
        </dl>
      </section>

        <ul class="recent" id="recent"></ul>
      </section>
      <section class="panel" id="tools">

      </section>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

function rect(x,y,w,h,c,extra){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" class="'+c+'"'+(extra||'')+'/>'}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function resolve(x,y){
  var best=null,bd=1e9;
  Z.forEach(function(z){
    var dx=Math.max(z.x-x,0,x-(z.x+z.w)),dy=Math.max(z.y-y,0,y-(z.y+z.h)),d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best=z}
  });
  var px=Math.min(26,best.w/2),py=Math.min(26,best.h/2);
  return {zone:best.id,x:clamp(x,best.x+px,best.x+best.w-px),y:clamp(y,best.y+py,best.y+best.h-py)};
}
function freeSpot(z,exId){
  var pad=Math.min(34,z.w/2,z.h/2),step=58,cx=z.x+z.w/2,cy=z.y+z.h/2,pts=[],xx,yy;
  for(yy=z.y+pad;yy<=z.y+z.h-pad+.5;yy+=step)for(xx=z.x+pad;xx<=z.x+z.w-pad+.5;xx+=step)pts.push([xx,yy]);
  if(!pts.length)pts.push([cx,cy]);
  pts.sort(function(a,b){return Math.hypot(a[0]-cx,a[1]-cy)-Math.hypot(b[0]-cx,b[1]-cy)});
  var others=ALL.filter(function(i){return i!==exId}).map(function(i){return pos[i]});
  for(var i=0;i<pts.length;i++){
    var p=pts[i];
    if(others.every(function(q){return Math.hypot(q.x-p[0],q.y-p[1])>56}))return {x:p[0],y:p[1]};
  }
  return {x:cx+(Math.random()-.5)*60,y:cy+(Math.random()-.5)*60};
}
function toStage(cx,cy){var r=layer.getBoundingClientRect();return {x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H}}
function place(el,x,y){el.style.left=(x/W*100)+'%';el.style.top=(y/H*100)+'%'}
function clean(v,id){
  var x=Number(v&&v.x),y=Number(v&&v.y);
  if(!isFinite(x)||!isFinite(y))return {x:DEF[id].x,y:DEF[id].y,zone:DEF[id].zone,t:0};
  var r=resolve(x,y);
  return {x:r.x,y:r.y,zone:r.zone,t:Number(v.t)||0};
}

var pend={},chains={};
function queue(id,fn,after){
  pend[id]=(pend[id]||0)+1;
  var run=(chains[id]||Promise.resolve()).then(fn);
  chains[id]=run.catch(function(){});
  return run.then(function(r){if(after)after();return r}).then(function(r){pend[id]--;return r},function(e){pend[id]--;throw e});
}
function onWriteError(id,e){
  var code=e&&e.code;
  if(code==='invalid_argument'){canWrite=false;setConn('ro');flash('No tienes permiso para mover fichas en esta página.')}
  else if(code==='quota_exceeded'){flash('La base de datos de la página está llena.')}
  else{flash('No se pudo guardar el movimiento de '+TK[id].name+'. Inténtalo otra vez.')}
  var s=server[id];
  pos[id]=s?{x:s.x,y:s.y,zone:s.zone,t:s.t}:{x:DEF[id].x,y:DEF[id].y,zone:DEF[id].zone,t:0};
  paint(id);renderInfo();updateSel();
}
function commit(id,p){
  var rec={x:Math.round(p.x),y:Math.round(p.y),zone:p.zone,t:Date.now()};
  pos[id]=rec;paint(id);renderInfo();
  if(!db)return;
  queue(id,function(){return db.doc('tokens/'+id).set(rec)},function(){server[id]=rec})
    .catch(function(e){onWriteError(id,e)});
}
function moveToZone(id,zid){

  place(drag.el,drag.x,drag.y);

}
function startAuto(){

    else if(drag.cy<top)dy=-Math.min(26,(top-drag.cy)/2+6);
    if(dy){scrollBy(0,dy);updateDrag()}
  },30);
}

layer.addEventListener('pointerdown',function(e){

  }else if(!cancel){

  }
}

/* Candado suave: sirve para elegir vista, no para proteger datos. */
function h53(s){
  var h1=0xdeadbeef,h2=0x41c6ce57,i,ch;
  for(i=0;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
